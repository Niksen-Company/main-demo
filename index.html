<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List – howtoniksen.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }
    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .input-row input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #4a90d9; }
    .input-row button {
      padding: 0.6rem 1.2rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-row button:hover { background: #3a7bc8; }
    #todo-list { list-style: none; }
    #todo-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      transition: background 0.15s;
    }
    #todo-list li:hover { background: #f7fafc; }
    #todo-list li input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: #4a90d9;
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-word;
    }
    .task-text.done {
      text-decoration: line-through;
      color: #a0aec0;
    }
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #e53e3e;
      font-size: 1.1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: background 0.15s;
      line-height: 1;
    }
    .delete-btn:hover { background: #fff5f5; }
    .empty-state {
      text-align: center;
      color: #a0aec0;
      font-size: 0.95rem;
      padding: 1.5rem 0;
    }
    .filters {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .filters button {
      padding: 0.3rem 0.9rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .filters button.active {
      background: #4a90d9;
      border-color: #4a90d9;
      color: #fff;
    }
    .footer-info {
      text-align: center;
      font-size: 0.8rem;
      color: #a0aec0;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 To-Do List</h1>
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task…" maxlength="200" />
      <button id="add-btn">Add</button>
    </div>
    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state">No tasks yet. Add one above!</p>
    <p class="footer-info">howtoniksen.com</p>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'niksen_todos';
      var todos = [];
      var currentFilter = 'all';
      var nextId = 1;

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          todos = raw ? JSON.parse(raw) : [];
          if (todos.length > 0) {
            nextId = Math.max.apply(null, todos.map(function (t) { return t.id; })) + 1;
          }
        } catch (e) {
          console.error('Failed to load tasks from localStorage:', e);
          todos = [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          console.error('Failed to save tasks to localStorage:', e);
        }
      }

      function render() {
        var list = document.getElementById('todo-list');
        var empty = document.getElementById('empty-state');
        var filtered = todos.filter(function (t) {
          if (currentFilter === 'active') return !t.done;
          if (currentFilter === 'done') return t.done;
          return true;
        });

        list.textContent = '';
        if (filtered.length === 0) {
          empty.style.display = 'block';
        } else {
          empty.style.display = 'none';
          filtered.forEach(function (todo) {
            var li = document.createElement('li');

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = todo.done;
            cb.setAttribute('aria-label', 'Mark task complete');
            cb.addEventListener('change', function () {
              toggle(todo.id);
            });

            var span = document.createElement('span');
            span.className = 'task-text' + (todo.done ? ' done' : '');
            span.textContent = todo.text;

            var del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '&#x2715;';
            del.setAttribute('aria-label', 'Delete task');
            del.addEventListener('click', function () {
              remove(todo.id);
            });

            li.appendChild(cb);
            li.appendChild(span);
            li.appendChild(del);
            list.appendChild(li);
          });
        }
      }

      function addTask(text) {
        text = text.trim();
        if (!text) return;
        todos.push({ id: nextId++, text: text, done: false });
        save();
        render();
      }

      function toggle(id) {
        todos = todos.map(function (t) {
          return t.id === id ? Object.assign({}, t, { done: !t.done }) : t;
        });
        save();
        render();
      }

      function remove(id) {
        todos = todos.filter(function (t) { return t.id !== id; });
        save();
        render();
      }

      document.getElementById('add-btn').addEventListener('click', function () {
        var input = document.getElementById('task-input');
        addTask(input.value);
        input.value = '';
        input.focus();
      });

      document.getElementById('task-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          addTask(this.value);
          this.value = '';
        }
      });

      document.querySelectorAll('.filters button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          currentFilter = this.getAttribute('data-filter');
          document.querySelectorAll('.filters button').forEach(function (b) {
            b.classList.remove('active');
          });
          this.classList.add('active');
          render();
        });
      });

      load();
      render();
    })();
  </script>
</body>
</html>
