<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List | howtoniksen.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      height: fit-content;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      color: #1a1a2e;
      text-align: center;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    #new-task {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #new-task:focus { border-color: #6c63ff; }
    #add-btn {
      padding: 0.6rem 1.1rem;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #add-btn:hover { background: #574fd6; }
    #task-list { list-style: none; }
    #task-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid #f0f0f0;
    }
    #task-list li:last-child { border-bottom: none; }
    .task-check {
      width: 20px;
      height: 20px;
      accent-color: #6c63ff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
    }
    .task-text.done {
      text-decoration: line-through;
      color: #aaa;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.25rem;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .delete-btn:hover { color: #e05252; }
    .empty-state {
      text-align: center;
      color: #bbb;
      font-size: 0.95rem;
      padding: 1.5rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#10003; To-Do List</h1>
    <div class="input-row">
      <input
        id="new-task"
        type="text"
        placeholder="Add a new task&hellip;"
        aria-label="New task"
        maxlength="200"
      />
      <button id="add-btn" aria-label="Add task">Add</button>
    </div>
    <ul id="task-list" aria-label="Task list"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add one above!</p>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'niksen-todo-tasks';

      var nextId = 0;

      function loadTasks() {
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
          saved.forEach(function (t) {
            if (t.id >= nextId) nextId = t.id + 1;
          });
          return saved;
        } catch (e) {
          return [];
        }
      }

      function saveTasks(tasks) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {}
      }

      var tasks = loadTasks();

      function render() {
        var list = document.getElementById('task-list');
        var emptyState = document.getElementById('empty-state');
        list.innerHTML = '';
        emptyState.style.display = tasks.length === 0 ? 'block' : 'none';

        tasks.forEach(function (task) {
          var taskId = task.id;
          var li = document.createElement('li');

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'task-check';
          checkbox.checked = task.done;
          checkbox.setAttribute('aria-label', 'Mark "' + task.text + '" as complete');
          checkbox.addEventListener('change', function () {
            var t = tasks.find(function (x) { return x.id === taskId; });
            if (t) { t.done = checkbox.checked; saveTasks(tasks); render(); }
          });

          var span = document.createElement('span');
          span.className = 'task-text' + (task.done ? ' done' : '');
          span.textContent = task.text;

          var delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = '\u00D7';
          delBtn.setAttribute('aria-label', 'Delete "' + task.text + '"');
          delBtn.addEventListener('click', function () {
            tasks = tasks.filter(function (x) { return x.id !== taskId; });
            saveTasks(tasks);
            render();
          });

          li.appendChild(checkbox);
          li.appendChild(span);
          li.appendChild(delBtn);
          list.appendChild(li);
        });
      }

      function addTask() {
        var input = document.getElementById('new-task');
        var text = input.value.trim();
        if (!text) return;
        tasks.push({ id: nextId++, text: text, done: false });
        saveTasks(tasks);
        input.value = '';
        render();
      }

      document.getElementById('add-btn').addEventListener('click', addTask);
      document.getElementById('new-task').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addTask();
      });

      render();
    })();
  </script>
</body>
</html>
