<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="main.js"></script>
</head>
<body>
  <h1>To-Do List</h1>
  <form id="todo-form">
    <input type="text" id="new-todo" placeholder="Add new task" required>
    <button type="submit">Add</button>
  </form>
  <ul id="todo-list"></ul>
</body>
</html>
