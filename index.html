<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | HowToNiksen</title>
  <link rel="stylesheet" href="https://unpkg.com/@primer/css@17.0.1/dist/primer.css">
  <style>
    body {
      background-color: #f6f8fa;
      min-height: 100vh;
    }
    .todo-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px 40px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #6e7781;
    }
    .todo-text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
    }
    .todo-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #cf222e;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
    }
    .todo-delete:hover {
      color: #a40e26;
    }
    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0969da;
    }
    #todo-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    #todo-input {
      flex: 1;
    }
    .empty-state {
      text-align: center;
      color: #6e7781;
      padding: 32px 0;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="todo-container">
    <h1 class="f1 mb-3">📝 To-Do List</h1>
    <p class="color-fg-muted mb-4">Keep track of your tasks on <strong>HowToNiksen.com</strong></p>

    <div id="todo-input-row">
      <input
        id="todo-input"
        class="form-control"
        type="text"
        placeholder="Add a new task…"
        maxlength="200"
        aria-label="New task"
      >
      <button id="add-btn" class="btn btn-primary" type="button">Add</button>
    </div>

    <ul id="todo-list" aria-label="Tasks" style="list-style:none;padding:0;margin:0;"></ul>
    <p id="empty-state" class="empty-state" aria-live="polite">No tasks yet. Add one above!</p>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'howtoniksen_todos';
      var todos = [];

      function loadTodos() {
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored) todos = JSON.parse(stored);
        } catch (e) {
          console.error('Failed to load todos:', e);
          todos = [];
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          console.error('Failed to save todos:', e);
        }

      function render() {
        var list = document.getElementById('todo-list');
        var empty = document.getElementById('empty-state');
        list.innerHTML = '';
        if (todos.length === 0) {
          empty.style.display = '';
          return;
        }
        empty.style.display = 'none';
        todos.forEach(function (todo, index) {
          var li = document.createElement('li');
          li.className = 'todo-item' + (todo.done ? ' completed' : '');

          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'todo-checkbox';
          cb.checked = todo.done;
          cb.setAttribute('aria-label', 'Mark "' + todo.text + '" as ' + (todo.done ? 'incomplete' : 'complete'));
          cb.addEventListener('change', function () { toggle(index); });

          var span = document.createElement('span');
          span.className = 'todo-text';
          span.textContent = todo.text;

          var del = document.createElement('button');
          del.className = 'todo-delete';
          del.textContent = '×';
          del.setAttribute('aria-label', 'Delete "' + todo.text + '"');
          del.addEventListener('click', function () { remove(index); });

          li.appendChild(cb);
          li.appendChild(span);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      function addTodo(text) {
        text = text.trim();
        if (!text) return;
        todos.push({ text: text, done: false });
        saveTodos();
        render();
      }

      function toggle(index) {
        todos[index].done = !todos[index].done;
        saveTodos();
        render();
      }

      function remove(index) {
        todos.splice(index, 1);
        saveTodos();
        render();
      }

      document.getElementById('add-btn').addEventListener('click', function () {
        var input = document.getElementById('todo-input');
        addTodo(input.value);
        input.value = '';
        input.focus();
      });

      document.getElementById('todo-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          addTodo(this.value);
          this.value = '';
        }
      });

      loadTodos();
      render();
    })();
  </script>
</body>
</html>
