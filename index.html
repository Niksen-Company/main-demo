<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niksen To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 2rem 1.5rem;
      height: fit-content;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6e6e73;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    #new-task {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1.5px solid #d2d2d7;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #new-task:focus { border-color: #0071e3; }

    #add-btn {
      padding: 0.75rem 1.25rem;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-btn:hover { background: #0077ed; }
    #add-btn:active { background: #005bb5; }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filter-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1.5px solid #d2d2d7;
      border-radius: 8px;
      background: #fff;
      font-size: 0.875rem;
      cursor: pointer;
      color: #6e6e73;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: #0071e3;
      border-color: #0071e3;
      color: #fff;
      font-weight: 600;
    }

    #task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e5e5ea;
      border-radius: 10px;
      background: #fafafa;
      transition: opacity 0.2s;
    }

    .task-item.done { opacity: 0.5; }

    .task-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #0071e3;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
      color: #1d1d1f;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #6e6e73;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff3b30;
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 0.25rem;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #c0392b; }

    .empty-msg {
      text-align: center;
      color: #a1a1a6;
      font-size: 0.95rem;
      padding: 1.5rem 0;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #6e6e73;
    }

    #clear-done {
      background: none;
      border: none;
      color: #ff3b30;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #clear-done:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 To-Do List</h1>
    <p class="subtitle">howtoniksen.com</p>

    <div class="input-row">
      <input id="new-task" type="text" placeholder="Add a new task…" maxlength="200" autocomplete="off" />
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty-msg" class="empty-msg">No tasks yet. Add one above!</p>

    <div class="footer-row">
      <span id="task-count">0 tasks</span>
      <button id="clear-done">Clear completed</button>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'niksen_todos';
      let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let filter = 'all';
      let nextId = tasks.reduce(function (max, t) { return t.id > max ? t.id : max; }, 0) + 1;

      const listEl = document.getElementById('task-list');
      const emptyMsg = document.getElementById('empty-msg');
      const taskCount = document.getElementById('task-count');
      const newTaskInput = document.getElementById('new-task');
      const addBtn = document.getElementById('add-btn');
      const clearDoneBtn = document.getElementById('clear-done');
      const filterBtns = document.querySelectorAll('.filter-btn');

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function render() {
        listEl.innerHTML = '';
        const filtered = tasks.filter(function (t) {
          if (filter === 'active') return !t.done;
          if (filter === 'done') return t.done;
          return true;
        });

        if (filtered.length === 0) {
          emptyMsg.style.display = 'block';
          if (tasks.length === 0) {
            emptyMsg.textContent = 'No tasks yet. Add one above!';
          } else if (filter === 'active') {
            emptyMsg.textContent = 'No active tasks.';
          } else if (filter === 'done') {
            emptyMsg.textContent = 'No completed tasks.';
          } else {
            emptyMsg.textContent = 'No tasks yet. Add one above!';
          }
        } else {
          emptyMsg.style.display = 'none';
        }

        filtered.forEach(function (task) {
          const li = document.createElement('li');
          li.className = 'task-item' + (task.done ? ' done' : '');

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = task.done;
          cb.setAttribute(
            'aria-label',
            (task.done ? 'Mark task "' + task.text + '" as not done' : 'Mark task "' + task.text + '" as done')
          );
          cb.addEventListener('change', function () {
            task.done = cb.checked;
            save();
            render();
          });

          const span = document.createElement('span');
          span.className = 'task-text';
          span.textContent = task.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.textContent = '×';
          del.setAttribute('aria-label', 'Delete task');
          del.addEventListener('click', function () {
            tasks = tasks.filter(function (t) { return t !== task; });
            save();
            render();
          });

          li.appendChild(cb);
          li.appendChild(span);
          li.appendChild(del);
          listEl.appendChild(li);
        });

        const total = tasks.length;
        const done = tasks.filter(function (t) { return t.done; }).length;
        taskCount.textContent = (total - done) + ' task' + ((total - done) !== 1 ? 's' : '') + ' remaining';
      }

      function addTask() {
        const text = newTaskInput.value.trim();
        if (!text) return;
        tasks.push({ text: text, done: false, id: nextId++ });
        newTaskInput.value = '';
        save();
        render();
      }

      addBtn.addEventListener('click', addTask);
      newTaskInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addTask();
      });

      clearDoneBtn.addEventListener('click', function () {
        tasks = tasks.filter(function (t) { return !t.done; });
        save();
        render();
      });

      filterBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          filter = btn.dataset.filter;
          filterBtns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
